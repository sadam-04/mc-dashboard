{% extends "hub/base.html" %}
{% comment %} {% load static %} {% endcomment %}

{% block content %}
    <div class="sub-header">
        <div class="text2 flex-row">Status:&nbsp;<div id="status"></div></div>
        <div class="flex-row" style="justify-content: flex-start; align-items: center;">
            <div id="refresh-state" style="color: #888;"></div>
            <button onclick="update_stats()" class="navBttn" id="refresh-bttn">refresh</button>
        </div>
    </div>
    
    <div id="motd"></div>
    <br />
    
    <div class="player-list-area">
        <div id="no-players-msg" style="display: none;">There are currently no players online.</div>
        <div id="player-list" class="flex-col" style="gap: 5px;">

        </div>
        <button id="hello_bttn" onclick="say_hello()" class="navBttn flex-row" style="display: none; width: fit-content;">Wave to&nbsp;<div id="player-count-value"></div>&nbsp;player(s)</button>
    </div>

    <div id="leaderboard" style="width: 100%; margin-top: 20px;">
        <div class="flex-row" style="justify-content: space-between; align-items: center; gap: 10px;">
            <div class="flex-row">
                <div class="text2">Leaderboard:&nbsp;</div>
                <select id="leaderboard-category" class="text2" >
                    <option value="deaths">Deaths</option>
                    <option value="playtime">Playtime</option>
                    <option value="damage_taken">Damage Taken</option>
                    <option value="damage_dealt">Damage Dealt</option>
                    <option value="mobs_killed">Mobs Killed</option>
                    <option value="distance_walked">Cm Walked</option>
                    <option value="distance_fallen">Cm Fallen</option>
                    <option value="animals_bred">Animals Bred</option>
                    <option value="slept">Times Slept</option>
                </select>
            </div>
            <div class="mobile-hide" style="color: #888;">Updates every ~5 mins</div>
        </div>
        <hr style="background-color: #888;">
        <div id="leaderboard-error" style="display: none;"></div>
        <ol id="leaderboard-scores" type="1" class="flex-col" style="gap: 15px;"></ol>
    </div>

    {% csrf_token %}

    <script>
        let playerCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            update_stats();
            update_leaderboard("deaths");
        });

        document.getElementById("leaderboard-category").addEventListener('change', (event) => {
            update_leaderboard(event.target.value);
        });

        const statusText = document.getElementById("status");
        const noPlayersMsg = document.getElementById("no-players-msg");
        const playerList = document.getElementById("player-list");
        const helloBttn = document.getElementById("hello_bttn");
        const motdText = document.getElementById("motd");
        const refreshMsg = document.getElementById("refresh-state");
        const refreshBttn = document.getElementById("refresh-bttn");
        const playerCountValue = document.getElementById("player-count-value");
        const leaderboardScores = document.getElementById("leaderboard-scores");
        const leaderboardError = document.getElementById("leaderboard-error");

        function update_leaderboard(category) {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            let res = fetch('/leaderboard/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({
                    category: category
                })
            })
            .then(raw => raw.json())
            .then(resp => {
                if (resp.status == "failure") {
                    leaderboardError.style.display = "block";
                    return;
                }

                let scores = JSON.parse(resp.scores);
                leaderboardScores.replaceChildren();

                if (scores.length == 0) {
                    // noPlayersMsg.innerHTML = "There are currently no players online";
                    leaderboardError.innerHTML = "No data found";
                    leaderboardError.style.display = "block";
                } else {
                    // onlinePlayerHeader.innerHTML = "Online players: " + players;
                    // noPlayersMsg.style.display = "none";
                    leaderboardError.style.display = "none";

                    for (let score of scores) {
                        let sLi = document.createElement("li");
                        let sDiv = document.createElement("div");
                        let sName = document.createElement("div");
                        let sScore = document.createElement("div");

                        sLi.classList.add("leaderboard");
                        
                        sDiv.classList.add("flex-row");
                        sDiv.style.justifyContent = "space-between";

                        // pDiv.classList.add("player-list-entry");
                        // pDiv.style.alignItems = "center";
                        // pDiv.style.gap = "10px";

                        sName.textContent = score[0];
                        sScore.textContent = score[1];
                        // pImg.src = "https://mc-api.io/render/FACE/" + p[1] + "?size=256";
                        // pImg.style.width = "30px";
                        
                        sDiv.appendChild(sName);
                        sDiv.appendChild(sScore);
                        sLi.appendChild(sDiv);
                        leaderboardScores.appendChild(sLi);
                    }
                }

            });
        }

        function update_stats() {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            refreshMsg.innerHTML = "refreshing...";
            refreshBttn.style.display = "none";
            let res = fetch('/status/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                }
            })
            .then(raw => raw.json())
            .then(resp => {
                setTimeout(() => {
                    refreshMsg.innerHTML = "";
                    refreshBttn.style.display = "block";
                }, 200);

                
                if (resp.status == "failure") {
                    statusText.innerHTML = "Offline";
                    statusText.style.color = "red";
                    noPlayersMsg.innerHTML = "Server offline";
                    return;
                }
                
                statusText.innerHTML = "Online";
                statusText.style.color = "limegreen";
                
                let players = JSON.parse(resp.players);
                let motd = resp.motd;
                
                console.log("Players: " + players);
                
                playerCount = players.length;
                playerCountValue.innerHTML = playerCount;

                playerList.replaceChildren()
                if (playerCount == 0) {
                    // noPlayersMsg.innerHTML = "There are currently no players online";
                    noPlayersMsg.style.display = "flex";
                    helloBttn.style.display = "none";
                } else {
                    // onlinePlayerHeader.innerHTML = "Online players: " + players;
                    noPlayersMsg.style.display = "none";
                    //build player list

                    for (let p of players) {
                        let pDiv = document.createElement("div");
                        let pName = document.createElement("div");
                        let pImg = document.createElement("img");
                        
                        pDiv.classList.add("flex-row");
                        pDiv.classList.add("player-list-entry");
                        pDiv.style.alignItems = "center";
                        pDiv.style.gap = "10px";
                        pName.textContent = p[0];
                        pImg.src = "https://mc-api.io/render/FACE/" + p[1] + "?size=256";
                        pImg.style.width = "30px";
                        
                        pDiv.appendChild(pImg);
                        pDiv.appendChild(pName);
                        playerList.appendChild(pDiv);
                    }

                    helloBttn.style.display = "flex";
                }
                motdText.innerHTML = motd;
            });
        }

        function say_hello() {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        //    const formData = new FormData();
        //    formData.append('action', actionName);

            fetch('/hi/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    if (playerCount == 1) {
                        alert("You waved to 1 player");
                    } else {
                        alert("You waved to " + playerCount + " players");
                    }
                } else {
                    alert("Error: " + data.error);
                }
            });
        }
    </script>
{% endblock content %}
