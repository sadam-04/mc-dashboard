{% extends "hub/base.html" %}
{% comment %} {% load static %} {% endcomment %}

{% block content %}
    <div class="sub-header">
        <div class="text2 flex-row">Status:&nbsp;<div id="status"></div></div>
        <div class="flex-row" style="justify-content: flex-start; align-items: center;">
            <div id="refresh-state" style="color: #888;"></div>
            <button onclick="update_stats()" class="navBttn" id="refresh-bttn">refresh</button>
        </div>
    </div>
    
    <div id="motd"></div>
    <br />
    
    <div class="player-list-area">
        <div id="no-players-msg" style="display: none;">There are currently no players online.</div>
        <div id="player-list" class="flex-col" style="gap: 5px;">

        </div>
        <button id="hello_bttn" onclick="say_hello()" class="navBttn flex-row" style="display: none; width: fit-content;">Wave to&nbsp;<div id="player-count-value"></div>&nbsp;player(s)</button>
    </div>

    <div id="leaderboard" style="width: 100%; margin-top: 20px;">
        <div class="text2">Death counter</div>
        <hr style="background-color: #888;">
        <ol type="1" class="flex-col" style="gap: 15px;">
        {% for player, score in leaderboard %}
            <li class="leaderboard"><div class="flex-row" style="justify-content: space-between;"><div>{{ player }}</div><div>{{ score }}</div></div></li>
        {% endfor %}
        </ol>
    </div>

    {% csrf_token %}

    <script>
        let playerCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            update_stats();
        });

        const statusText = document.getElementById("status");
        const noPlayersMsg = document.getElementById("no-players-msg");
        const playerList = document.getElementById("player-list");
        const helloBttn = document.getElementById("hello_bttn");
        const motdText = document.getElementById("motd");
        const refreshMsg = document.getElementById("refresh-state");
        const refreshBttn = document.getElementById("refresh-bttn");
        const playerCountValue = document.getElementById("player-count-value");

        function update_stats() {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            refreshMsg.innerHTML = "refreshing...";
            refreshBttn.style.display = "none";
            let res = fetch('/status/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                }
            })
            .then(raw => raw.json())
            .then(resp => {
                setTimeout(() => {
                    refreshMsg.innerHTML = "";
                    refreshBttn.style.display = "block";
                }, 200);

                
                if (resp.status == "failure") {
                    statusText.innerHTML = "Offline";
                    statusText.style.color = "red";
                    noPlayersMsg.innerHTML = "Server offline";
                    return;
                }
                
                statusText.innerHTML = "Online";
                statusText.style.color = "limegreen";
                
                let players = JSON.parse(resp.players);
                let motd = resp.motd;
                
                console.log("Players: " + players);
                
                playerCount = players.length;
                playerCountValue.innerHTML = playerCount;

                playerList.replaceChildren()
                if (playerCount == 0) {
                    // noPlayersMsg.innerHTML = "There are currently no players online";
                    noPlayersMsg.style.display = "flex";
                    helloBttn.style.display = "none";
                } else {
                    // onlinePlayerHeader.innerHTML = "Online players: " + players;
                    noPlayersMsg.style.display = "none";
                    //build player list

                    for (let p of players) {
                        let pDiv = document.createElement("div");
                        let pName = document.createElement("div");
                        let pImg = document.createElement("img");
                        
                        pDiv.classList.add("flex-row");
                        pDiv.classList.add("player-list-entry");
                        pDiv.style.alignItems = "center";
                        pDiv.style.gap = "10px";
                        pName.textContent = p[0];
                        pImg.src = "https://mc-api.io/render/FACE/" + p[1] + "?size=256";
                        pImg.style.width = "30px";
                        
                        pDiv.appendChild(pImg);
                        pDiv.appendChild(pName);
                        playerList.appendChild(pDiv);
                    }

                    helloBttn.style.display = "flex";
                }
                motdText.innerHTML = motd;
            });
        }

        function say_hello() {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        //    const formData = new FormData();
        //    formData.append('action', actionName);

            fetch('/hi/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    if (playerCount == 1) {
                        alert("You waved to 1 player");
                    } else {
                        alert("You waved to " + playerCount + " players");
                    }
                } else {
                    alert("Error: " + data.error);
                }
            });
        }
    </script>
{% endblock content %}
