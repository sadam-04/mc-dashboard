{% load static %}
<html>
    <head>
        <title>Pisscraft</title>
    
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'css/global.css' %}">
    </head>
    <body>
        <div class="header">
            <div class="flex-row">
                <div class="funny-title-text">Pisscraft.com</div>
                <img src={% static 'img/susron.gif'%} style="width: 30px; height: 30px;">
                <img src={% static 'img/susron.gif'%} style="width: 30px; height: 30px;">
                <img src={% static 'img/susron.gif'%} style="width: 30px; height: 30px;">
            </div>

            <div class="nav-buttons mobile-hide">
                <a href="/" class="navBttn">Home</a>
                <a href="/places" class="navBttn">Places</a>
                <div style="display: flex; flex-direction: row;">
                    <a href="/map" class="navBttn" style="border-radius: 7px 0 0 7px">Dynmap</a>
                    <a href="https://map.pisscraft.com" target="_blank" class="navBttn" style="border-radius: 0 7px 7px 0">&#8599;</a>
                </div>
            </div>

            {% if user.is_authenticated %}
            <a href="/users/logout" class="navBttn">Log out</a>
            {% else %}
            <a href="/users/login" class="navBttn">Log in</a>
            {% endif %}
        </div>
        <div class="nav-buttons desktop-hide" style="border-bottom: 1px solid #808080; margin: 0 8px; padding-bottom: 8px;">
            <a href="/" class="navBttn">Home</a>
            <a href="/places" class="navBttn">Places</a>
            <div style="display: flex; flex-direction: row;">
                <a href="/map" class="navBttn" style="border-radius: 7px 0 0 7px">Dynmap</a>
                <a href="https://map.pisscraft.com" target="_blank" class="navBttn" style="border-radius: 0 7px 7px 0">&#8599;</a>
            </div>
        </div>
        <div class="content">
            {% block content %}
            {% endblock content %}
        </div>
        {% block contentFull %}
        {% endblock contentFull %}
    </body>
</html>
