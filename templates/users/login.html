{% extends "hub/base.html" %}

{% block content %}
<h2 style="display: flex; justify-content: center;">yo</h2>

{% if form.errors %}
  <p style="color: red;">Incorrect username or password</p>
{% endif %}

<form class="login-form" method="post">
  {% csrf_token %}
  
  {% for field in form %}
    {{ field }}
    {% if field.errors %}
      <div class="login-field-error">{{ field.errors }}</div>
    {% endif %}
  {% endfor %}

  <button type="submit" class="navBttn" style="margin-top: 20px;">Log In</button>
</form>

<div class="text3">or</div>

<a class="navBttn" href="/users/new/" style="margin-top: 12px;">Create Account</a>

{% endblock content %}
